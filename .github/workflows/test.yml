name: Verify mathematics

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run mathematical verification
        run: node --test tests/collatz-math.test.js

      - name: Check JavaScript syntax
        run: |
          node --check collatz-math.js
          node --check tests/collatz-math.test.js
